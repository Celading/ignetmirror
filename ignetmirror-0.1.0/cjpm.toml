[package]
  cjc-version = "1.1.3"
  name = "ignetmirror"
  version = "0.1.0"
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  license = "Apache-2.0"
  include = ["src", "README.md", "LICENSE", "NOTICE"]
  exclude = ["target", "build", "_helper", "scripts", "cangjie-repo.toml", "__pycache__", "*.pyc", "*.bak"]
  description = "Deterministic network emulation and mirror tee in pure Cangjie std: seeded drop/duplicate/delay/reorder decisions, token-bucket bandwidth, bounded release queues"
